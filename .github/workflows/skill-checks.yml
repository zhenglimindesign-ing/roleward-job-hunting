name: Skill checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: roleward-job-hunting
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: roleward-job-hunting
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package-validator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate package
        run: python -B scripts/validate_skill.py
      - name: Run deterministic workflow and fixture checks
        shell: bash
        run: |
          for check in smoke_context smoke_opportunity smoke_scan smoke_application smoke_learn smoke_eval smoke_pursuit_eval smoke_application_integrity smoke_scan_selection smoke_journey smoke_search_settings eval_runner; do
            python -B "scripts/${check}.py"
          done
